# Nginx reverse proxy for email-mcp server
# HTTPS termination + API key validation + rate limiting
#
# Replace YOUR_DOMAIN with your actual domain (e.g. mcp.example.com)
# Replace YOUR_MCP_API_KEY with the key from .env

# Rate limiting: 10 requests/sec per IP
limit_req_zone $binary_remote_addr zone=mcp_limit:10m rate=10r/s;

# Upstream — MCP server
# Docker: use service name "mcp". Bare metal: use 127.0.0.1
upstream mcp_backend {
    server mcp:8000;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # ── SSL certificates (Let's Encrypt) ────────────────────────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # ── TLS hardening ───────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # ── API key validation ──────────────────────────────────────
    # Client must send: Authorization: Bearer <MCP_API_KEY>
    set $expected_key "YOUR_MCP_API_KEY";

    # ── SSE endpoint ────────────────────────────────────────────
    location /sse {
        # Validate API key
        if ($http_authorization != "Bearer ${expected_key}") {
            return 401 '{"error": "Unauthorized"}';
        }

        limit_req zone=mcp_limit burst=20 nodelay;

        proxy_pass http://mcp_backend/sse;
        proxy_http_version 1.1;

        # SSE-specific: disable buffering, keep connection alive
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Messages endpoint (MCP protocol) ────────────────────────
    location /messages/ {
        if ($http_authorization != "Bearer ${expected_key}") {
            return 401 '{"error": "Unauthorized"}';
        }

        limit_req zone=mcp_limit burst=20 nodelay;

        proxy_pass http://mcp_backend/messages/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block everything else
    location / {
        return 404 '{"error": "Not found"}';
    }

    # Logging
    access_log /var/log/nginx/email-mcp.access.log;
    error_log  /var/log/nginx/email-mcp.error.log;
}
