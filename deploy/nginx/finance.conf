upstream finance_api {
    server finance-api:8001;
}

upstream finance_frontend {
    server finance-frontend:80;
}

server {
    listen 80;
    server_name YOUR_FINANCE_DOMAIN;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name YOUR_FINANCE_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/YOUR_FINANCE_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_FINANCE_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Rate limiting for login
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;

    # API proxy
    location /api/ {
        proxy_pass http://finance_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login rate limiting
    location /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://finance_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Frontend
    location / {
        proxy_pass http://finance_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
