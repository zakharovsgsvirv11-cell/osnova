[project]
name = "email-mcp"
version = "0.2.0"
description = "MCP server for Exchange email management via EWS"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "exchangelib>=5.4.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
email-mcp-server = "email_mcp.server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]
