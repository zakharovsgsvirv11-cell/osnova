services:
  # MCP server — internal, not exposed to the internet
  mcp:
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    networks:
      - internal

  # Finance Tracker — API backend
  finance-api:
    build: ./finance/backend
    restart: unless-stopped
    env_file: .env
    expose:
      - "8001"
    volumes:
      - finance-data:/app/data
    networks:
      - internal

  # Finance Tracker — Vue frontend
  finance-frontend:
    build: ./finance/frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - internal

  # Nginx — HTTPS reverse proxy, the only public-facing service
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/email-mcp.conf:/etc/nginx/conf.d/email-mcp.conf:ro
      - ./deploy/nginx/finance.conf:/etc/nginx/conf.d/finance.conf:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - mcp
      - finance-api
      - finance-frontend
    networks:
      - internal

  # Certbot — automatic certificate renewal
  certbot:
    image: certbot/certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    # Renew every 12 hours (certbot skips if not needed)
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h; done'"
    networks:
      - internal

volumes:
  certbot-webroot:
  certbot-certs:
  finance-data:

networks:
  internal:
    driver: bridge
